<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>NovaCart Post</title>

  <meta
    name="description"
    content="NovaCart product discovery post"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HEADER -->
  <header>

    <a class="logo" href="index.html">
      NOVA<span>CART</span>
    </a>

    <nav>
      <a href="index.html">Home</a>
      <a href="index.html#products">Products</a>
      <a href="index.html#posts">Posts</a>
    </nav>

    <a
      href="admin.html"
      style="
        margin-left:auto;
        text-decoration:none;
        font-weight:700;
        color:inherit;
      "
    >
      Admin
    </a>

  </header>


  <!-- POST -->
  <main class="post-page">

    <div id="postLoading">
      Loading post...
    </div>

    <article id="postContent" hidden>

      <div id="postImageWrap"></div>

      <small id="postCategory">
        NOVACART
      </small>

      <h1 id="postTitle"></h1>

      <p id="postExcerpt"></p>

      <div
        id="postBody"
        class="post-body"
      ></div>


      <!-- RELATED PRODUCTS -->
      <section id="relatedProducts">

        <small>
          PRODUCTS FROM THIS POST
        </small>

        <h2>
          Featured products
        </h2>

        <div
          id="postProducts"
          class="grid"
        ></div>

      </section>

    </article>


    <!-- ERROR -->
    <div
      id="postError"
      hidden
    >
      <h2>
        Post not found
      </h2>

      <p>
        This post may have been removed or is not published.
      </p>

      <a href="index.html">
        ← Back to NovaCart
      </a>
    </div>

  </main>


  <!-- FOOTER -->
  <footer id="footer">
    NovaCart · Free product discovery store
  </footer>


  <script
    type="module"
    src="post.js"
  ></script>

</body>
</html>
