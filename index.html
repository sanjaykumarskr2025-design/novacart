<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title id="pageTitle">NovaCart</title>

  <meta
    id="metaDescription"
    name="description"
    content="NovaCart product discovery store"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ================= HEADER ================= -->
  <header>

    <a class="logo" href="index.html" id="siteLogo">
      NOVA<span>CART</span>
    </a>

    <nav id="nav">
      <!-- Navigation will be loaded from Supabase -->
    </nav>

    <!-- ADMIN BUTTON -->
    <a
      href="admin.html"
      id="adminLink"
      style="
        margin-left:auto;
        margin-right:12px;
        text-decoration:none;
        font-weight:700;
        color:inherit;
      "
    >
      Admin
    </a>

    <!-- CART -->
    <button id="cartBtn">
      Bag <b id="count">0</b>
    </button>

  </header>


  <!-- ================= HERO ================= -->
  <section class="hero">

    <div>

      <small>
        CURATED PRODUCT DISCOVERY
      </small>

      <h1 id="heroTitle">
        Products that<br>
        <em>stand out.</em>
      </h1>

      <p id="heroText">
        Discover trending products with direct buying links.
      </p>

      <button id="heroButton">
        Explore ↗
      </button>

    </div>


    <!-- 3D STYLE ORB -->
    <div class="orb3d">
      <div>N</div>
    </div>

  </section>


  <!-- ================= CATEGORIES ================= -->
  <section id="categories">

    <small>
      CATEGORIES
    </small>

    <h2>
      Browse
    </h2>

    <div
      id="cats"
      class="cats"
    ></div>

  </section>


  <!-- ================= POSTS ================= -->
  <section id="posts">

    <small>
      DISCOVER
    </small>

    <h2>
      Latest posts
    </h2>

    <div
      id="postsGrid"
      class="grid"
    ></div>

  </section>


  <!-- ================= PRODUCTS ================= -->
  <section id="products">

    <small>
      STORE
    </small>

    <h2>
      Featured products
    </h2>

    <div
      id="productsGrid"
      class="grid"
    ></div>

  </section>


  <!-- ================= ADSENSE ================= -->
  <div
    id="homeAd"
    class="adbox"
  ></div>


  <!-- ================= CART ================= -->
  <div
    id="cart"
    class="drawer"
  >

    <button
      onclick="toggleCart()"
      aria-label="Close cart"
    >
      ×
    </button>

    <h2>
      Your Bag
    </h2>

    <div id="cartItems"></div>

    <h3 id="total">
      ₹0
    </h3>

    <button
      onclick="whatsapp()"
    >
      Order on WhatsApp
    </button>

  </div>


  <!-- ================= FOOTER ================= -->
  <footer id="footer">
    NovaCart · Free product discovery store
  </footer>


  <!-- ================= JAVASCRIPT ================= -->
  <script
    type="module"
    src="store.js"
  ></script>

</body>

</html>
