<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us — NovaCart</title>
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/accessibility.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <header class="header scrolled" id="header">
        <div class="container header-container">
            <a href="index.html" class="logo">
                <div class="logo-mark">N</div>
                <span class="logo-text">NOVACART</span>
            </a>
            <nav class="nav-menu">
                <ul class="nav-list">
                    <li><a href="index.html" class="nav-link">Home</a></li>
                    <li><a href="shop.html" class="nav-link">Shop</a></li>
                    <li><a href="contact.html" class="nav-link active">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main-content" style="padding-top: 120px; padding-bottom: 5rem;">
        <div class="container">
            <div style="max-width: 600px; margin: 0 auto;" class="glass-panel" style="padding: 3rem;">
                <h1 style="font-family: var(--font-heading); font-size: 2.25rem; margin-bottom: 0.5rem;">Contact Support</h1>
                <p style="color: var(--text-secondary); margin-bottom: 2rem;">Have questions about your order or dropshipping fulfillment? Reach out to our 24/7 team.</p>
                <form id="contact-form" style="display: flex; flex-direction: column; gap: 1.25rem;">
                    <div>
                        <label style="display: block; font-size: 0.85rem; margin-bottom: 0.5rem; color: var(--text-secondary);">Your Name</label>
                        <input type="text" id="contact-name" required placeholder="Sanjay Kumar" style="width: 100%; padding: 0.75rem; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: var(--text-primary);">
                    </div>
                    <div>
                        <label style="display: block; font-size: 0.85rem; margin-bottom: 0.5rem; color: var(--text-secondary);">Email Address</label>
                        <input type="email" id="contact-email" required placeholder="sanjay@example.com" style="width: 100%; padding: 0.75rem; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: var(--text-primary);">
                    </div>
                    <div>
                        <label style="display: block; font-size: 0.85rem; margin-bottom: 0.5rem; color: var(--text-secondary);">Message</label>
                        <textarea id="contact-message" rows="5" required placeholder="How can we assist you?" style="width: 100%; padding: 0.75rem; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: var(--text-primary);"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary" style="padding: 1rem;">Send Message</button>
                </form>
            </div>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/theme.js"></script>
    <script>
        document.getElementById('contact-form').addEventListener('submit', (e) => {
            e.preventDefault();
            NotificationSystem.show('Message sent successfully! We will get back to you within 24 hours.', 'success');
            e.target.reset();
        });
    </script>
</body>
</html>
