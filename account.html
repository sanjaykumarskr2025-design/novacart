<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Account — NovaCart</title>
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/accessibility.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <header class="header scrolled" id="header">
        <div class="container header-container">
            <a href="index.html" class="logo">
                <div class="logo-mark">N</div>
                <span class="logo-text">NOVACART</span>
            </a>
            <nav class="nav-menu">
                <ul class="nav-list">
                    <li><a href="index.html" class="nav-link">Home</a></li>
                    <li><a href="shop.html" class="nav-link">Shop</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main-content" style="padding-top: 120px; padding-bottom: 5rem;">
        <div class="container">
            <h1 style="font-family: var(--font-heading); font-size: 2.5rem; margin-bottom: 2rem;">Customer Account Dashboard</h1>

            <div style="display: grid; grid-template-columns: 280px 1fr; gap: 2.5rem;">
                <div class="glass-panel" style="padding: 1.5rem; height: fit-content;">
                    <ul style="display: flex; flex-direction: column; gap: 0.75rem;">
                        <li><a href="account.html" class="nav-link active">Profile & Settings</a></li>
                        <li><a href="orders.html" class="nav-link">Order History</a></li>
                        <li><a href="wishlist.html" class="nav-link">Saved Wishlist</a></li>
                        <li><a href="admin/dashboard.html" class="nav-link" style="color: var(--accent-warning);">Admin Panel</a></li>
                    </ul>
                </div>

                <div class="glass-panel" style="padding: 2.5rem;">
                    <h3 style="font-family: var(--font-heading); font-size: 1.25rem; margin-bottom: 1.5rem;">Account Profile</h3>
                    <div style="display: flex; flex-direction: column; gap: 1rem; color: var(--text-secondary);">
                        <div><strong>Email:</strong> customer@novacart.demo</div>
                        <div><strong>Account Status:</strong> Verified Active (Demo Mode)</div>
                        <div><strong>Saved Addresses:</strong> 1 Default Address</div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/theme.js"></script>
</body>
</html>
