<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NovaCart Admin</title><link rel="stylesheet" href="style.css"></head>
<body class="admin"><header><a class="logo" href="index.html">NOVA<span>CART</span> ADMIN</a><a href="index.html">Store ↗</a></header>
<main class="dashboard">
<div id="login"><h1>Admin Login</h1><p>Use your Supabase email and password.</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="loginBtn">Login</button><p id="loginMsg"></p></div>
<div id="panel" hidden><div class="dashhead"><div><small>CONTROL CENTER</small><h1>Products</h1></div><button id="logout">Logout</button></div>
<form id="productForm"><input type="hidden" id="pid"><input id="name" placeholder="Product name" required><input id="category" placeholder="Category" required><input id="price" type="number" placeholder="Price" required><input id="image" placeholder="Image URL" required><input id="buy" placeholder="Buy / affiliate URL" required><textarea id="description" placeholder="Description"></textarea><div><button type="submit">Save product</button><button type="button" id="cancel">Cancel</button></div></form>
<div id="adminProducts"></div></div></main><script type="module" src="admin.js"></script></body></html>
