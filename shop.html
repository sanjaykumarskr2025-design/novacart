<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop All Products — NovaCart</title>
    <meta name="description" content="Browse the full catalog of futuristic technology, smart wearables, and lifestyle dropshipping products.">
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/accessibility.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.8/dist/umd/supabase.js"></script>
</head>
<body>
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <!-- Header -->
    <header class="header scrolled" id="header">
        <div class="container header-container">
            <a href="index.html" class="logo">
                <div class="logo-mark">N</div>
                <span class="logo-text">NOVACART</span>
            </a>
            <nav class="nav-menu">
                <ul class="nav-list">
                    <li><a href="index.html" class="nav-link">Home</a></li>
                    <li><a href="shop.html" class="nav-link active">Shop</a></li>
                    <li><a href="shop.html?filter=deals" class="nav-link highlight-deal">Deals</a></li>
                    <li><a href="about.html" class="nav-link">About</a></li>
                    <li><a href="contact.html" class="nav-link">Contact</a></li>
                </ul>
            </nav>
            <div class="header-actions">
                <a href="wishlist.html" class="icon-btn wishlist-btn" aria-label="Wishlist">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
                    <span class="badge" id="wishlist-badge">0</span>
                </a>
                <button id="cart-trigger-btn" class="icon-btn cart-btn" aria-label="Shopping Cart">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
                    <span class="badge" id="cart-badge">0</span>
                </button>
            </div>
        </div>
    </header>

    <main class="main-content" style="padding-top: 120px; padding-bottom: 5rem;">
        <div class="container">
            <div class="shop-header" style="margin-bottom: 3rem;">
                <h1 style="font-family: var(--font-heading); font-size: 2.5rem; margin-bottom: 0.5rem;">Explore Catalog</h1>
                <p style="color: var(--text-secondary);">Browse high-performance dropshipping innovations with instant filtering.</p>
            </div>

            <div class="shop-layout" style="display: grid; grid-template-columns: 280px 1fr; gap: 2.5rem;">
                <!-- Sidebar Filters -->
                <aside class="shop-sidebar glass-panel" style="padding: 1.5rem; height: fit-content;">
                    <h3 style="font-family: var(--font-heading); font-size: 1.1rem; margin-bottom: 1.25rem;">Categories</h3>
                    <ul id="filter-categories" style="display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 2rem;">
                        <li><a href="#" class="filter-cat-link active" data-category="all">All Products</a></li>
                        <li><a href="#" class="filter-cat-link" data-category="smart-lighting">Smart Lighting</a></li>
                        <li><a href="#" class="filter-cat-link" data-category="kitchen">Kitchen Tech</a></li>
                        <li><a href="#" class="filter-cat-link" data-category="power">Power & Chargers</a></li>
                        <li><a href="#" class="filter-cat-link" data-category="audio-visual">Audio & Visual</a></li>
                        <li><a href="#" class="filter-cat-link" data-category="lifestyle">Lifestyle</a></li>
                    </ul>

                    <h3 style="font-family: var(--font-heading); font-size: 1.1rem; margin-bottom: 1.25rem;">Sort By</h3>
                    <select id="sort-select" style="width: 100%; padding: 0.75rem; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: var(--text-primary);">
                        <option value="featured">Featured</option>
                        <option value="newest">Newest Arrivals</option>
                        <option value="price-low">Price: Low to High</option>
                        <option value="price-high">Price: High to Low</option>
                        <option value="rating">Highest Rated</option>
                    </select>
                </aside>

                <!-- Product Grid Area -->
                <section class="shop-products">
                    <div class="products-grid" id="shop-products-grid">
                        <!-- Dynamically populated -->
                    </div>
                </section>
            </div>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/wishlist.js"></script>
    <script src="js/theme.js"></script>
    <script>
        const ShopApp = {
            currentCategory: 'all',
            currentSort: 'featured',

            init() {
                const urlParams = new URLSearchParams(window.location.search);
                const cat = urlParams.get('category');
                if (cat) this.currentCategory = cat;

                this.renderProducts();
                this.bindEvents();
            },

            renderProducts() {
                const grid = document.getElementById('shop-products-grid');
                if (!grid) return;

                let products = [...Utils.sampleProducts];

                if (this.currentCategory !== 'all') {
                    products = products.filter(p => p.category === this.currentCategory);
                }

                if (this.currentSort === 'price-low') {
                    products.sort((a, b) => a.price - b.price);
                } else if (this.currentSort === 'price-high') {
                    products.sort((a, b) => b.price - a.price);
                } else if (this.currentSort === 'rating') {
                    products.sort((a, b) => b.rating - a.rating);
                }

                if (products.length === 0) {
                    grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-secondary); padding: 4rem;">No products found in this category.</p>`;
                    return;
                }

                grid.innerHTML = products.map(p => {
                    const isInWishlist = Wishlist.isItemInWishlist(p.id);
                    return `
                        <div class="product-card">
                            <div class="product-image-wrapper">
                                <span class="product-badge">${p.badge || 'Sale'}</span>
                                <button class="wishlist-toggle-btn ${isInWishlist ? 'active' : ''}" onclick="ShopApp.toggleWishlist('${p.id}')">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="${isInWishlist ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
                                </button>
                                <a href="product.html?id=${p.id}"><img src="${p.image_url}" alt="${p.name}" class="product-image"></a>
                            </div>
                            <div class="product-content">
                                <div class="product-category">${p.category_name}</div>
                                <h3 class="product-title"><a href="product.html?id=${p.id}">${p.name}</a></h3>
                                <div class="product-rating">★ <span>${p.rating} (${p.reviews_count})</span></div>
                                <div class="product-footer">
                                    <div class="product-price">
                                        <span class="current-price">${Utils.formatCurrency(p.price)}</span>
                                        <span class="original-price">${Utils.formatCurrency(p.original_price)}</span>
                                    </div>
                                    <button class="btn btn-primary" style="padding: 0.5rem 1rem; font-size: 0.85rem;" onclick="Cart.addItem(${JSON.stringify(p).replace(/"/g, '&quot;')})">Add</button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            },

            toggleWishlist(productId) {
                const product = Utils.sampleProducts.find(p => p.id === productId);
                if (product) {
                    Wishlist.toggleItem(product);
                    this.renderProducts();
                }
            },

            bindEvents() {
                document.querySelectorAll('.filter-cat-link').forEach(link => {
                    link.addEventListener('click', (e) => {
                        e.preventDefault();
                        document.querySelectorAll('.filter-cat-link').forEach(l => l.classList.remove('active'));
                        link.classList.add('active');
                        this.currentCategory = link.getAttribute('data-category');
                        this.renderProducts();
                    });
                });

                const sortSelect = document.getElementById('sort-select');
                if (sortSelect) {
                    sortSelect.addEventListener('change', (e) => {
                        this.currentSort = e.target.value;
                        this.renderProducts();
                    });
                }
            }
        };

        document.addEventListener('DOMContentLoaded', () => ShopApp.init());
    </script>
</body>
</html>
